[build]
  base = "/"
  publish = "apps/rickandmorty/.next"
  command = "pnpm install && pnpm --filter ./apps/rickandmorty... run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://rickandmortyapi.com/graphql"

# Next.js plugin for optimal deployment
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
