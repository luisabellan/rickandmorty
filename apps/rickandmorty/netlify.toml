[build]
  base = "/"
  publish = "apps/rickandmorty/.next"
  command = "pnpm install && pnpm --recursive --filter ./packages/* build && cd apps/rickandmorty && pnpm build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://rickandmorty-api-csmq.onrender.com/graphql"

[[plugins]]
  package = "@netlify/plugin-nextjs"
