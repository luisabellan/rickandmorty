[build]
  base = "/"
  publish = "apps/rickandmorty/.next"
  command = "pnpm install && cd apps/rickandmorty && NEXT_PUBLIC_TURBOPACK=0 pnpm build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://rickandmorty-api-csmq.onrender.com/graphql"

[[plugins]]
  package = "@netlify/plugin-nextjs"